name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q career_qa app.py tests

      - name: 安装虚拟显示（供 GUI 测试使用）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: 运行测试
        run: xvfb-run -a python -m unittest discover -s tests -t . -v

      - name: 环境自检（不依赖 Ollama，允许失败）
        continue-on-error: true
        run: python app.py --check
